<!doctype html>
<html><head><meta charset="utf-8"><title>Two-factor authentication — Northwind</title><link rel="stylesheet" href="style.css"></head>
<body>
  <form class="card" action="home.html" method="get">
    <div class="brand"><span class="logo"></span>Northwind</div>
    <h1>Two-factor authentication</h1>
    <p>Enter the 6-digit code from your authenticator app</p>
    <label for="code">Authentication code</label>
    <input id="code" class="otp" type="text" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
    <button>Verify</button>
  </form>
</body></html>
