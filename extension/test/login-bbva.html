<!doctype html>
<html><head><meta charset="utf-8"><title>Acceso — bank with web components</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  .row { margin: 10px 0; width: 300px; }
</style>
</head>
<body>
  <!-- A bank sign-in built from custom elements (BBVA-like): the chrome is in
       each component's open shadow root, the native controls stay in the light
       DOM, slotted. The document type is a hidden native <select>; the user
       types the username into a password-type field ("Usuario").
       Flags: ?btn=inner (only the button inside the shadow root listens),
       ?controlled=1 (the select component ignores the native change and puts
       its own value back), ?clearOnType=1 (changing the type clears the number),
       ?trap=hidden | host | before-other | before-plain | extra | pin | slot-tiny | slot-full (page tricks), ?spa=1 (the form
       goes after a submit), ?btn=handler (the button signs in from its own click
       handler, with no submit event: counts its calls in window.__calls),
       ?btn=fetch (the same, but its handler only posts with fetch: no DOM
       change, no submit event; the page first fills its resource-timing buffer
       with 260 requests, then sets window.__ready), ?btn=slow (the same, its
       fetch to slow-signin answered late by the test: nothing shows it worked
       for seconds), ?stale=number | username (that field's component puts a
       stale value back after a change), &pinLabel= (?trap=pin's label,
       default "PIN"), ?live=1 (what the live page does: the number field
       has no name — its component carries it — and every control a new
       random "_xxxxxxxxxx" id on each load; Usuario and Clave are read-only
       until &ro= ms after load, default 1500; the document type is an
       <x-select-items> like bbva-form-select-sph: its list only in its
       `items` attribute, and a placeholder <select> holding the chosen key,
       put just before it, that it never reads back). With ?live=1:
       &late=<ms> | never (the component renders its options that long after
       the list opens, or never), &shadow=closed (its shadow root is closed),
       &items=malformed | dup | many | big (its `items` attribute is broken
       JSON, has duplicate keys and labels, 101 items, or over 20 kB; the
       component still lists DNI, LC, LE, PASAPORTE). Clicks on the component
       are counted in window.__compClicks. -->
  <h1>Acceso</h1>
  <form name="login">
    <x-select name="documentType" label="Tipo de documento">
      <select slot="_select" name="documentType" tabindex="-1" aria-hidden="true"
              style="position:absolute;opacity:0;pointer-events:none;z-index:-1">
        <option value="01" selected>DNI</option>
        <option value="02">LE</option>
        <option value="03">PAS</option>
      </select>
    </x-select>

    <div class="row"><x-input><input slot="_input" type="number" name="documentNumber" aria-label="Número de documento"></x-input></div>
    <div class="row"><x-input><input slot="_input" type="password" name="username" aria-label="Usuario" autocomplete="off"></x-input></div>
    <div class="row"><x-input><input slot="_input" type="password" name="password" aria-label="Clave" autocomplete="off"></x-input></div>

    <fieldset style="display:none"><input type="radio" name="gender" value="F"><input type="radio" name="gender" value="M"></fieldset>
    <label class="row"><input type="checkbox" name="remember"> Recordar</label>

    <x-button type="submit">Ingresar</x-button>
    <div id="trap"></div>
  </form>
  <pre id="result"></pre>

<script>
  const params = new URLSearchParams(location.search);
  const form = document.forms.login;

  if (params.get('live')) {
    // Like the live ids (_iimft4p9kg): base 36 with a digit before a letter
    // (Math.random() gives one ~95% of the time; forced here).
    window.randomId = () => `_${Math.random().toString(36).slice(2, 6)}${Math.floor(Math.random() * 10)}k${Math.random().toString(36).slice(2, 6)}`;
    for (const el of form.querySelectorAll('input, select')) el.id = randomId();
    const number = form.elements.documentNumber;
    number.parentElement.setAttribute('name', 'documentNumber');
    number.removeAttribute('name');
    number.dataset.doc = '1';
    // The document type as the live page has it: the component keeps the
    // list; it puts its own one-option select before itself.
    const items = [
      { key: '0', value: '0', selected: true, description: 'DNI, Documento Nacional de Identidad', text: 'DNI' },
      { key: '1', value: '1', selected: false, description: 'LC, Libreta Cívica', text: 'LC' },
      { key: '2', value: '2', selected: false, description: 'LE, Libreta de Enrolamiento', text: 'LE' },
      { key: '4', value: '4', selected: false, description: 'PASAPORTE', text: 'PASAPORTE' },
    ];
    const comp = document.createElement('x-select-items');
    comp.setAttribute('name', 'documentType');
    comp.setAttribute('label', 'Tipo de documento');
    const filler = n => Array.from({ length: n }, (_, i) => ({ key: `f${i}`, value: `f${i}`, text: `Otro ${i}` }));
    const attr = {
      malformed: '[{"key":"0","value":"0","text":"DNI"},',
      dup: JSON.stringify([...items, { key: '2', value: '2', selected: false, description: 'LE', text: 'LE' }]),
      many: JSON.stringify([...items, ...filler(97)]),
      big: JSON.stringify([...items.slice(0, 3), { ...items[3], description: 'x'.repeat(20001) }]),
    }[params.get('items')];
    comp.list = items;
    comp.setAttribute('items', attr || JSON.stringify(items));
    form.querySelector('x-select').replaceWith(comp);
    const masked = [form.elements.username, form.elements.password];
    for (const el of masked) el.readOnly = true;
    setTimeout(() => { for (const el of masked) el.readOnly = false; }, Number(params.get('ro') || 1500));
  }

  class XSelect extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = '<style>:host{display:block;width:300px;min-height:36px;border:1px solid #888}</style>'
        + '<div class="label"></div><div class="shown"></div><slot name="_select"></slot>';
      root.querySelector('.label').textContent = this.getAttribute('label') || '';
      this.select = this.querySelector('select');
      this.select.addEventListener('change', () => {
        if (params.get('controlled')) {
          // Ignores the native change: its own state wins on the next render.
          setTimeout(() => { this.select.value = this.select.options[0].value; this.render(); }, 50);
        } else {
          this.render();
        }
      });
      this.render();
    }
    render() {
      this.shadowRoot.querySelector('.shown').textContent = this.select.selectedOptions[0].textContent;
    }
  }
  // bbva-form-select-sph: a combobox button and [role=option]s in its open
  // shadow root, rendered from `items`; picking one (a click) shows it and
  // writes its key into the native select. Changes made to that select are
  // stopped and ignored (the component's own state wins).
  class XSelectItems extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      if (this._root) return;
      this.items = this.list || JSON.parse(this.getAttribute('items'));
      this.chosen = this.items.find(i => i.selected) || this.items[0];
      const root = this._root = this.attachShadow({ mode: params.get('shadow') === 'closed' ? 'closed' : 'open' });
      root.innerHTML = '<style>:host{display:block;width:300px;min-height:36px;border:1px solid #888}#list{display:none}#list.opened{display:block}</style>'
        + '<button id="button" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false"><span class="label"></span> <span class="content-text"></span></button>'
        + '<div id="list" role="listbox"></div>';
      root.querySelector('.label').textContent = this.getAttribute('label');
      const list = root.getElementById('list');
      const button = root.getElementById('button');
      const setOpen = open => { list.classList.toggle('opened', open); button.setAttribute('aria-expanded', String(open)); };
      const renderOptions = () => {
        if (list.childElementCount) return;
        for (const item of this.items) {
          const opt = document.createElement('x-option');
          opt.setAttribute('role', 'option');
          opt.textContent = item.text;
          opt.addEventListener('click', () => { this.chosen = item; setOpen(false); this.render(); });
          list.append(opt);
        }
      };
      const late = params.get('late');
      if (!late) renderOptions();
      window.__compClicks = 0;
      this.addEventListener('click', () => { window.__compClicks++; });
      button.addEventListener('click', () => {
        const open = !list.classList.contains('opened');
        setOpen(open);
        if (open && late && late !== 'never') setTimeout(renderOptions, Number(late));
      });
      this.select = document.createElement('select');
      this.select.setAttribute('slot', '_select');
      this.select.name = this.getAttribute('name');
      this.select.style.cssText = 'position:absolute;opacity:0;pointer-events:none;z-index:-1';
      this.select.tabIndex = -1;
      this.select.setAttribute('aria-hidden', 'true');
      this.select.id = window.randomId ? window.randomId() : '';
      for (const type of ['input', 'change']) this.select.addEventListener(type, e => e.stopPropagation());
      this.select.append(document.createElement('option'));
      this.parentNode.insertBefore(this.select, this);
      this.render();
    }
    render() {
      const opt = this.select.options[0];
      opt.value = this.chosen.value;
      opt.textContent = this.chosen.value;
      this.select.value = this.chosen.value;
      this._root.querySelector('.content-text').textContent = this.chosen.text;
    }
  }
  class XInput extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      this.attachShadow({ mode: 'open' }).innerHTML = '<style>:host{display:block}</style><slot name="_input"></slot>';
    }
  }
  class XButton extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = '<style>:host{display:inline-block}button{padding:8px 24px}</style><button type="button"><slot></slot></button>';
      const go = () => form.requestSubmit();
      if (params.get('btn') === 'inner') root.querySelector('button').addEventListener('click', go);
      else if (params.get('btn') === 'handler') {
        // Signs in from the click itself (an app posting with fetch): no
        // submit event. A click on the shadow button bubbles here too.
        window.__calls = 0;
        this.addEventListener('click', () => {
          window.__calls++;
          document.getElementById('result').textContent = JSON.stringify(Object.fromEntries(new FormData(form)));
        });
      } else if (params.get('btn') === 'slow') {
        // A slow sign-in: the request takes seconds, nothing changes meanwhile.
        window.__calls = 0;
        this.addEventListener('click', () => {
          window.__calls++;
          window.__sent = Object.fromEntries(new FormData(form));
          fetch(`slow-signin?n=${window.__calls}`, { cache: 'no-store' }).catch(() => null);
        });
      } else if (params.get('btn') === 'fetch') {
        // Signs in with fetch only: nothing on the page changes.
        window.__calls = 0;
        this.addEventListener('click', () => {
          window.__calls++;
          window.__sent = Object.fromEntries(new FormData(form));
          fetch(`login-bbva.html?signin=${window.__calls}`, { cache: 'no-store' });
        });
      } else this.addEventListener('click', go);
    }
  }
  customElements.define('x-select', XSelect);
  customElements.define('x-select-items', XSelectItems);
  customElements.define('x-input', XInput);
  customElements.define('x-button', XButton);

  if (params.get('clearOnType')) {
    form.elements.documentType.addEventListener('change', () => { form.elements.documentNumber.value = ''; });
  }

  // A controlled component whose state didn't take the fill: it puts its
  // previous (stale, non-empty) value back.
  const stale = { number: ['documentNumber', '11112222'], username: ['username', 'user-stale'] }[params.get('stale')];
  if (stale) {
    const el = form.elements[stale[0]];
    el.addEventListener('change', () => setTimeout(() => { el.value = stale[1]; }, 50));
  }

  // Tricks a page could play against extra-field filling.
  const trap = document.getElementById('trap');
  if (params.get('trap') === 'hidden') {
    // A select nobody sees, not slotted under a component.
    trap.innerHTML = '<select name="trapSelect" style="opacity:0"><option value="a" selected>A</option><option value="b">Secret</option></select>';
  } else if (params.get('trap') === 'host') {
    // Slotted, but its component carries another name.
    trap.innerHTML = '<x-select name="other" label="Other"><select slot="_select" name="trapSelect" style="position:absolute;opacity:0"><option value="a" selected>A</option><option value="b">Secret</option></select></x-select>';
  } else if (params.get('trap') === 'before-other') {
    // Slotted, just before a component that carries another name.
    trap.innerHTML = '<select slot="_select" name="trapSelect" style="position:absolute;opacity:0"><option value="a" selected>A</option><option value="b">Secret</option></select>'
      + '<x-input name="other" style="display:block;width:300px;height:36px"></x-input>';
  } else if (params.get('trap') === 'before-plain') {
    // Slotted, just before an element carrying its name that is no component.
    trap.innerHTML = '<select slot="_select" name="trapSelect" style="position:absolute;opacity:0"><option value="a" selected>A</option><option value="b">Secret</option></select>'
      + '<div name="trapSelect" style="display:block;width:300px;height:36px"></div>';
  } else if (params.get('trap') === 'extra') {
    trap.innerHTML = '<div class="row"><input type="text" name="branchCode" aria-label="Sucursal"></div>';
  } else if (params.get('trap') === 'pin') {
    // A visible field labelled like something the user may keep by hand.
    trap.innerHTML = '<div class="row"><input type="text" name="pin"></div>';
    trap.querySelector('input').setAttribute('aria-label', params.get('pinLabel') || 'PIN');
  } else if (params.get('trap') === 'slot-tiny' || params.get('trap') === 'slot-full') {
    // An invisible input slotted into a component carrying its name: 2x2 px
    // (nothing the user can see), or a normal-size field.
    const size = params.get('trap') === 'slot-tiny' ? 'width:2px;height:2px;overflow:hidden' : 'width:300px;height:36px';
    trap.innerHTML = `<x-input name="pin" style="display:block;${size}"><input slot="_input" type="text" name="pin" aria-label="PIN" style="opacity:0"></x-input>`;
  }

  if (params.get('btn') === 'fetch') {
    // A heavy app: the resource-timing buffer (250 entries) is full, so a
    // new request no longer shows in performance.getEntriesByType().
    Promise.all(Array.from({ length: 260 }, (_, i) =>
      fetch(`login-bbva.html?r=${i}`, { cache: 'no-store' }).then(r => r.text()).catch(() => null)))
      .then(() => { window.__ready = true; });
  }

  form.addEventListener('submit', e => {
    e.preventDefault(); // no action: nothing leaves the page, nothing in the URL
    document.getElementById('result').textContent = JSON.stringify(Object.fromEntries(new FormData(form)));
    // ?spa=1: signing in replaces the form, like an app that doesn't navigate.
    if (params.get('spa')) { form.remove(); document.querySelector('h1').textContent = 'Panel'; }
  });
</script>
</body></html>
