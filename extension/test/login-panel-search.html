<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in panel next to a search form</title></head>
<body>
  <!-- A form-less sign-in panel: a search form sits right next to the
       fields, closer to them than the panel's Verify button. -->
  <section id="panel">
    <div class="fields">
      <div class="row"><input type="email" id="email" autocomplete="username"></div>
      <div class="row"><input type="password" id="password" autocomplete="current-password"></div>
      <form action="search.html" method="get"><input type="search" name="q"><button>Search</button></form>
    </div>
    <div class="actions"><button type="button" id="verify">Verify</button></div>
  </section>
  <script>
    document.getElementById('verify').onclick = () => {
      location.href = 'welcome.html?email=' + encodeURIComponent(document.getElementById('email').value)
        + '&password=' + encodeURIComponent(document.getElementById('password').value);
    };
  </script>
</body></html>
