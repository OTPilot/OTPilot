<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in — one form, two steps</title></head>
<body>
  <!-- Both steps in one form: the password field is hidden until "Next",
       which then removes the username field. -->
  <form action="welcome.html" method="get">
    <div id="step1"><input type="email" name="identifier" autocomplete="username"><button type="button" id="next">Next</button></div>
    <div id="step2" style="display:none"><input type="password" name="password" autocomplete="current-password"><button>Sign in</button></div>
  </form>
  <script>
    document.getElementById('next').addEventListener('click', () => {
      setTimeout(() => {
        document.getElementById('step1').remove();
        document.getElementById('step2').style.display = '';
      }, 50);
    });
  </script>
</body></html>
