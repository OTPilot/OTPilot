<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in (remembers another user)</title></head>
<body>
  <!-- The site remembered a different username. -->
  <form action="welcome.html" method="get">
    <input type="email" name="email" autocomplete="username" value="someone@else.com">
    <input type="password" name="password" autocomplete="current-password">
    <button>Sign in</button>
  </form>
</body></html>
