<!doctype html>
<html><head><meta charset="utf-8"><title>Create account</title></head>
<body>
  <!-- Fixed questions: the question is the answer field's label. -->
  <form action="welcome.html" method="get">
    <label>Username <input type="text" name="username" autocomplete="username"></label>
    <label>Password <input type="password" name="password" autocomplete="new-password"></label>
    <label for="sa1">What was the name of your first pet?</label>
    <input id="sa1" type="text" name="securityAnswer1">
    <label for="sa2">In what city were you born?</label>
    <input id="sa2" type="text" name="securityAnswer2">
    <label>Company <input type="text" name="company"></label>
    <button>Create account</button>
  </form>
</body></html>
