<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Instagram</title></head>
<body>
  <!-- Instagram's 2FA screen, as of 2025: a "Security Code" tel field named
       verificationCode (maxlength 8: backup codes are 8 digits). -->
  <form id="f">
    <h2>Two-factor authentication</h2>
    <p>Enter the 6-digit code generated by your authentication app.</p>
    <input aria-label="Security Code" aria-required="true" autocapitalize="off" autocorrect="off" maxlength="8" type="tel" value="" name="verificationCode">
    <button type="submit">Confirm</button>
  </form>
  <script>document.getElementById('f').addEventListener('submit', e => e.preventDefault())</script>
</body>
</html>
