<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in widget (no navigation)</title></head>
<body>
  <!-- Never navigates: ?then=remove asks the page to remove this frame
       (signed in); ?then=reject keeps the form (a rejected password) and
       asks the page to load another frame of this site. -->
  <form id="f">
    <input type="email" name="email" autocomplete="username">
    <input type="password" name="password" autocomplete="current-password">
    <button>Sign in</button>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', e => {
      e.preventDefault();
      const then = new URLSearchParams(location.search).get('then');
      setTimeout(() => parent.postMessage(then === 'remove' ? 'remove-me' : 'add-frame', '*'), 300);
    });
  </script>
</body></html>
