<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in (input type=button)</title></head>
<body>
  <div id="app"></div>
  <script>
    // Like xStation 5: a form with no action and no submit button; its
    // "Login" is an <input type="button"> the page's script handles. The
    // sign-in replaces the form (no navigation). A native submit would
    // reload the page (?submitted=1 shows it happened).
    const app = document.getElementById('app');
    app.innerHTML = `
      <form autocomplete="off">
        <input type="text" name="xslogin" autocomplete="new-login">
        <input type="password" name="xspass" autocomplete="current-password">
        <input type="button" class="xs-btn" value="Login">
      </form>`;
    document.querySelector('form').addEventListener('submit', () => { location.search = '?submitted=1'; });
    document.querySelector('.xs-btn').addEventListener('click', () => {
      const user = document.querySelector('[name=xslogin]').value;
      const pass = document.querySelector('[name=xspass]').value;
      setTimeout(() => { app.innerHTML = `<h1>Dashboard</h1><p id="who">${user}:${pass}</p>`; }, 200);
    });
  </script>
</body></html>
