<!doctype html>
<html><head><meta charset="utf-8"><title>Account</title></head>
<!-- A combined form whose id reads like registering, but it signs in. -->
<body>
  <form id="login-register" method="post" action="/account/" onsubmit="return false">
    <input type="text" name="user">
    <input type="password" name="pw">
    <button type="submit">Sign in</button>
  </form>
</body></html>
