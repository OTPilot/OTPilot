<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in</title>
<style>
  .field { position: relative; width: 340px; height: 48px; margin: 16px; border: 1px solid #ccc; border-radius: 12px; }
  .field input { width: 100%; height: 100%; box-sizing: border-box; border: 0; border-radius: 12px; padding: 0 12px; background: transparent; }
  .eye { position: absolute; right: 8px; top: 12px; width: 24px; height: 24px; border: 0; background: #888; pointer-events: none; }
</style></head>
<body>
  <form onsubmit="return false">
    <div class="field">
      <input type="email" name="email" autocomplete="username" aria-label="Email">
    </div>
    <div class="field" id="pass-field">
      <input type="password" name="password" autocomplete="current-password" aria-label="Password">
    </div>
    <button type="submit">Sign in</button>
  </form>
  <script>
    // The eye appears 500ms AFTER the page loads, like a framework that adds
    // controls after initial render (or LastPass that injects its icon).
    setTimeout(() => {
      const field = document.getElementById('pass-field');
      const eye = document.createElement('button');
      eye.type = 'button';
      eye.className = 'eye';
      eye.setAttribute('aria-label', 'Ver contraseña');
      field.appendChild(eye);
    }, 500);
  </script>
</body></html>
