<!doctype html>
<html><head><meta charset="utf-8"><title>Acceso — read-only PIN</title></head>
<body>
  <!-- ABANCA-like: the PIN field is read-only and typed on a keypad.
       ?hold=1 keeps the page (the submit is shown in #result, not sent). -->
  <form id="f" action="welcome.html" method="get">
    <label for="card01">NIF:</label>
    <input type="text" id="card01" name="card01">
    <label for="pin_number">PIN:</label>
    <input type="password" id="pin_number" name="pin_number" maxlength="6" readonly>
    <div id="keypad">
      <button type="button">1</button><button type="button">2</button><button type="button">3</button>
      <button type="button">4</button><button type="button">5</button><button type="button">6</button>
    </div>
    <button type="submit">Access</button>
  </form>
  <pre id="result"></pre>
<script>
  const pin = document.getElementById('pin_number');
  document.getElementById('keypad').addEventListener('click', e => {
    if (e.target.tagName === 'BUTTON' && pin.value.length < 6) pin.value += e.target.textContent;
  });
  if (new URLSearchParams(location.search).get('hold')) {
    document.getElementById('f').addEventListener('submit', e => {
      e.preventDefault();
      document.getElementById('result').textContent = JSON.stringify({
        card01: document.getElementById('card01').value, pin: pin.value, readonly: pin.hasAttribute('readonly'),
      });
    });
  }
</script>
</body></html>
