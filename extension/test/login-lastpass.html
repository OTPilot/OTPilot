<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in</title>
<style>
  .field { position: relative; width: 340px; height: 48px; margin: 16px; border: 1px solid #ccc; border-radius: 12px; }
  .field input { width: 100%; height: 100%; box-sizing: border-box; border: 0; border-radius: 12px; padding: 0 12px; background: transparent; }
  .eye { position: absolute; right: 8px; top: 12px; width: 24px; height: 24px; border: 0; background: #888; }
</style></head>
<body>
  <form onsubmit="return false">
    <div class="field">
      <input type="email" name="email" autocomplete="username" aria-label="Email">
    </div>
    <div class="field">
      <input type="password" name="password" autocomplete="current-password" aria-label="Password">
      <button type="button" class="eye" aria-label="Ver contraseña"></button>
      <!-- LastPass: a 0×0 root, the icon painted in a closed shadow. -->
      <div id="lp" data-lastpass-icon-root style="position:absolute;width:0;height:0;top:13px;right:62px"></div>
    </div>
    <button type="submit">Sign in</button>
  </form>
  <script>
    const host = document.getElementById('lp');
    const shadow = host.attachShadow({ mode: 'closed' });
    const icon = document.createElement('div');
    icon.style.cssText = 'position:absolute;left:0;top:0;width:22px;height:22px;background:#e24';
    shadow.appendChild(icon);
  </script>
</body></html>
