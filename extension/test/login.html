<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in</title></head>
<body>
  <form id="login" onsubmit="event.preventDefault()">
    <input type="text" name="q" placeholder="Search" style="display:none">
    <label>Email <input type="email" name="email" autocomplete="username"></label>
    <label>Password <input type="password" name="password" autocomplete="current-password"></label>
    <button>Sign in</button>
  </form>
  <form id="signup" style="margin-top:40px" onsubmit="event.preventDefault()">
    <input type="text" name="new_user">
    <input type="password" name="new_pw" autocomplete="new-password">
  </form>
</body></html>
