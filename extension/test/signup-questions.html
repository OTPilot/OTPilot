<!doctype html>
<html><head><meta charset="utf-8"><title>Activate Account</title></head>
<body>
  <!-- Like the "Activate Account" form: a new password, then two picked
       security questions and their answers (the second one masked).
       GET so the static test server can serve the next page (test only). -->
  <h1>Activate Account</h1>
  <form action="welcome.html" method="get">
    <table>
      <tr><td>Email Address:</td><td><input type="email" name="email" autocomplete="username"></td></tr>
      <tr><td><label for="pw">Password:</label></td><td><input id="pw" type="password" name="password" autocomplete="new-password"></td></tr>
      <tr><td><label for="pw2">Confirm Password:</label></td><td><input id="pw2" type="password" name="confirmPassword" autocomplete="new-password"></td></tr>
      <tr><td><label for="q1">Question #1:</label></td><td>
        <select id="q1" name="securityQuestion1">
          <option value="">Select a question</option>
          <option value="1">Mother's maiden name</option>
          <option value="2">City of birth</option>
          <option value="3">Name of your first pet</option>
        </select></td></tr>
      <tr><td><label for="a1">Answer #1:</label></td><td><input id="a1" type="text" name="securityAnswer1"></td></tr>
      <tr><td><label for="q2">Question #2:</label></td><td>
        <select id="q2" name="securityQuestion2">
          <option value="">Select a question</option>
          <option value="1">Mother's maiden name</option>
          <option value="2">City of birth</option>
          <option value="3">Name of your first pet</option>
        </select></td></tr>
      <tr><td><label for="a2">Answer #2:</label></td><td><input id="a2" type="password" name="securityAnswer2"></td></tr>
    </table>
    <button>Activate</button>
  </form>
</body></html>
