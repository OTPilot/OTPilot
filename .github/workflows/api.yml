name: API

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # For the DB-backed integration tests (`--features db-tests`): each test
    # creates its own database on this server and applies the migrations.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --features db-tests -- -D warnings

      - name: test
        run: cargo test --features db-tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build api/ -t otpilot-api:ci
